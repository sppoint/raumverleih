name: eva2 synchronisieren

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stundenplan an PythonAnywhere senden
        env:
          PYTHONANYWHERE_URL: ${{ secrets.PYTHONANYWHERE_URL }}
          RAUMVERLEIH_SYNC_TOKEN: ${{ secrets.RAUMVERLEIH_SYNC_TOKEN }}
        run: python push_schedule.py
