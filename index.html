<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4efe5">
  <title>Raum&uuml;bersicht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">H-BRS · Gebaeude C</p>
        <h1>Raum&uuml;bersicht</h1>
        <p class="intro">Stundenplan-Belegung und verliehene Raeume auf einen Blick.</p>
      </div>

      <div class="clock-card" aria-label="Aktuelle Uhrzeit">
        <p><span class="live-dot"></span>Aktueller Stand</p>
        <strong id="liveDate">-</strong>
        <span id="liveTime">-</span>
      </div>
    </header>

    <main>
      <section class="status-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-kicker">Raumstatus jetzt</p>
            <h2 id="availabilitySummary">Raeume werden geladen ...</h2>
          </div>
          <div id="stats" class="stats" aria-label="Status-Zusammenfassung"></div>
        </div>

        <div class="toolbar">
          <label class="search-field">
            <span>Raum suchen</span>
            <input id="searchInput" type="search" placeholder="z. B. C115" autocomplete="off">
          </label>

          <label class="filter-field">
            <span>Status anzeigen</span>
            <select id="statusFilter">
              <option value="all">Alle Raeume</option>
              <option value="free">Nur frei</option>
              <option value="loaned">Nur verliehen</option>
              <option value="scheduled">Nur belegt</option>
            </select>
          </label>
        </div>

        <div class="legend" aria-label="Farberklaerung">
          <span><i class="legend-dot free"></i>Frei</span>
          <span><i class="legend-dot scheduled"></i>Stundenplan</span>
          <span><i class="legend-dot loaned"></i>Verliehen</span>
        </div>

        <div id="roomsGrid" class="rooms-grid" aria-live="polite"></div>
        <p id="saveMessage" class="save-message" role="status" aria-live="polite"></p>
      </section>
    </main>

  </div>

  <template id="roomCardTemplate">
    <article class="room-card">
      <div class="room-card-top">
        <div>
          <p class="room-building">Gebaeude C</p>
          <h3 class="room-name"></h3>
        </div>
        <span class="room-badge"></span>
      </div>
      <div class="room-information">
        <p class="room-detail"></p>
        <p class="room-next"></p>
      </div>
      <button class="room-action" type="button"></button>
    </article>
  </template>

  <script src="eva2-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
